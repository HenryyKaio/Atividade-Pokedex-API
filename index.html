<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="Icone.png" type="image/x-icon">
</head>

<body>



    <div class="pokedex">
        <img src="Pokedex.png" alt="">
    <form action="" id="busca">
        <input type="text" id="nome" placeholder="Nome do pokemon...">
        <button id="enviar" type="button">Buscar</button>
    </form>
    </div>

    <div class="conteinerCarta">
        <div class="carta">
            <span id="nomePokemon"></span>
            <img  alt=""
                id="card">
            <div class="campoTipo" id="tipos">
            </div>
            <div class="campoFisico">
                <div class="linha1">
                    <span id="altura"></span>
                    <span id="peso"></span>
                </div>
                <div class="linha2">
                    <span>Altura</span>
                    <span>Peso</span>
                </div>
            </div>
            <div class="campoStats">
                <ul>
                    <li><span id="hp">HP </span>
                        <div class="percentConteiner"><div id="percent1" class="percent"></div></div>
                    </li>
                    <li><span id="ataque">Ataque </span>
                        <div class="percentConteiner"><div id="percent2" class="percent"></div></div>
                    </li>
                    <li><span id="defesa">Defesa </span>
                        <div class="percentConteiner"><div id="percent3" class="percent"></div></div>
                    </li>
                    <li><span id="velocidade">Velocidade </span>
                        <div class="percentConteiner"><div id="percent4" class="percent"></div></div>
                    </li>
                </ul>
            </div>
        </div>
    </div>

    <script src="Pokedex.js" defer></script>




</body>

</html>
